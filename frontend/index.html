<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match & Ticket Reservation</title>
    
    <!-- CDN Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Oswald & Chakra Petch -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind Custom Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: '#FBF9F5',
                        football: {
                            light: '#D6F5E3',
                            bold: '#82D6A5',
                        },
                        volleyball: {
                            light: '#D9EAFB',
                            bold: '#80B6E9',
                        },
                        basketball: {
                            light: '#FDE2D3',
                            bold: '#F69664',
                        }
                    },
                    fontFamily: {
                        chakra: ['"Chakra Petch"', 'sans-serif'],
                        oswald: ['"Oswald"', 'sans-serif'],
                    },
                    keyframes: {
                        gradientBG: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                        }
                    },
                    animation: {
                        'gradient-shift': 'gradientBG 4s ease infinite',
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Modern Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #FBF9F5;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 20px;
            border: 2px solid #FBF9F5;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #80B6E9;
        }

        /* Floating Animated Background Shapes */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-25px) rotate(8deg) scale(1.05); }
        }
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Smooth Wave Floating Animation for Sport Category Cards */
        @keyframes floatCard {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .animate-float-slow {
            animation: floatSlow 10s ease-in-out infinite;
        }
        .animate-spin-slow {
            animation: spinSlow 35s linear infinite;
        }
        .animate-float-card {
            animation: floatCard 4s ease-in-out infinite;
        }
        
        .animated-gradient-btn {
            background-size: 200% 200%;
        }

        #sidebar-backdrop {
            transition: opacity 0.3s ease;
        }
        #sidebar-backdrop.hidden {
            display: none;
        }
        #sidebar-backdrop:not(.hidden) {
            display: block;
            opacity: 0;
        }
        #sidebar-backdrop:not(.hidden).opacity-100 {
            opacity: 1;
        }

    </style>
</head>
<body class="bg-[#FBF9F5] text-stone-800 antialiased font-chakra min-h-screen flex flex-col justify-between selection:bg-[#80B6E9] selection:text-white overflow-x-hidden">

    <!-- 1. Header (Floating Glass Header with updated background color and increased transparency) -->
    <header class="bg-[#FBF9F5]/50 backdrop-blur-xl border-b border-stone-200/50 shadow-sm sticky top-0 z-50 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 h-20 relative flex items-center justify-between">
            
            
            <div class="w-36 flex items-center">

                <div id="admin-panel-btn-container" class="hidden">
                    <a href="admin/dashboard.html" class="bg-stone-900 text-white font-chakra font-bold text-xs sm:text-sm px-4 py-2 rounded-xl transition-all duration-300 shadow-md hover:bg-stone-800 flex items-center gap-2 whitespace-nowrap">
                        <span>Admin dashboard</span>
                    </a>
                </div>

                <div id="user-menu-btn-container" class="hidden">
                    <button
                        id="hamburger-btn"
                        class="w-12 h-12 rounded-2xl
                        bg-gradient-to-r from-[#D6F5E3] via-[#80B6E9] to-[#FDE2D3]
                        border border-white/60
                        shadow-lg hover:shadow-xl
                        transition-all duration-300
                        flex items-center justify-center"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6 text-stone-800">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Center Logo -->
            <a href="index.html" class="absolute left-1/2 -translate-x-1/2 flex items-center group max-w-[120px] sm:max-w-none">
                <img src="assets/images/header-logo.webp" alt="TicketHub Logo" class="h-18 sm:h-12 w-auto object-contain transition-transform duration-300 group-hover:scale-105">
            </a>

            <!-- Right Animated Login/Signup Button -->
            <div class="relative group w-auto flex justify-end">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-[#82D6A5] via-[#80B6E9] to-[#F69664] rounded-full blur opacity-75 group-hover:opacity-100 transition duration-500 animated-gradient-btn animate-gradient-shift"></div>
                <a id="auth-btn" href="login.html" class="relative bg-gradient-to-r from-[#82D6A5] via-[#80B6E9] to-[#F69664] animated-gradient-btn animate-gradient-shift text-slate-950 font-chakra font-bold text-[10px] sm:text-sm px-3.5 sm:px-6 py-2 sm:py-2.5 rounded-full transition-all duration-300 shadow-md flex items-center hover:scale-105 whitespace-nowrap">
                    <span>Login / Signup</span>
                </a>
            </div>

        </div>

    </header>

    <!-- SIDEBAR BACKDROP -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 hidden transition-opacity duration-300"></div>

    <!-- SIDEBAR MENU -->
    <div id="sidebar-menu" class="fixed top-0 left-0 h-full w-80 bg-white/95 backdrop-blur-xl shadow-2xl border-r border-stone-200/80 z-50 -translate-x-full transition-transform duration-300 flex flex-col">
        <!-- Header -->
        <div class="h-20 px-6 flex items-center justify-between border-b border-stone-200/80 bg-gradient-to-r from-[#FBF9F5] to-white">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#82D6A5] to-[#80B6E9] flex items-center justify-center shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-white">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </div>
                <h3 class="font-oswald font-bold text-xl text-stone-900 tracking-wide">My Account</h3>
            </div>

            <button
                id="close-sidebar-btn"
                class="w-10 h-10 rounded-xl hover:bg-stone-100 transition-all duration-300 flex items-center justify-center text-stone-500 hover:text-stone-900"
            >
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="profile.html" class="flex items-center gap-4 px-4 py-3.5 rounded-xl bg-gradient-to-r from-[#D6F5E3]/30 to-transparent hover:from-[#D6F5E3]/60 transition-all duration-300 group border border-transparent hover:border-[#82D6A5]/30">
                <span class="w-9 h-9 rounded-lg bg-[#D6F5E3]/60 flex items-center justify-center text-lg group-hover:scale-110 transition-transform">👤</span>
                <span class="font-chakra font-semibold text-stone-700 group-hover:text-stone-900">My Profile</span>
                <span class="ml-auto text-stone-400 group-hover:translate-x-1 transition-transform">→</span>
            </a>

            <a href="bookings.html" class="flex items-center gap-4 px-4 py-3.5 rounded-xl bg-gradient-to-r from-[#D9EAFB]/30 to-transparent hover:from-[#D9EAFB]/60 transition-all duration-300 group border border-transparent hover:border-[#80B6E9]/30">
                <span class="w-9 h-9 rounded-lg bg-[#D9EAFB]/60 flex items-center justify-center text-lg group-hover:scale-110 transition-transform">🎫</span>
                <span class="font-chakra font-semibold text-stone-700 group-hover:text-stone-900">My Bookings</span>
                <span class="ml-auto text-stone-400 group-hover:translate-x-1 transition-transform">→</span>
            </a>

            <a href="report.html" class="flex items-center gap-4 px-4 py-3.5 rounded-xl bg-gradient-to-r from-[#FDE2D3]/30 to-transparent hover:from-[#FDE2D3]/60 transition-all duration-300 group border border-transparent hover:border-[#F69664]/30">
                <span class="w-9 h-9 rounded-lg bg-[#FDE2D3]/60 flex items-center justify-center text-lg group-hover:scale-110 transition-transform">📊</span>
                <span class="font-chakra font-semibold text-stone-700 group-hover:text-stone-900">Reports</span>
                <span class="ml-auto text-stone-400 group-hover:translate-x-1 transition-transform">→</span>
            </a>

            <a href="my-reservation.html" class="flex items-center gap-4 px-4 py-3.5 rounded-xl bg-gradient-to-r from-[#D9EAFB]/30 to-transparent hover:from-[#D9EAFB]/60 transition-all duration-300 group border border-transparent hover:border-[#80B6E9]/30">
                <span class="w-9 h-9 rounded-lg bg-[#D9EAFB]/60 flex items-center justify-center text-lg group-hover:scale-110 transition-transform">📌</span>
                <span class="font-chakra font-semibold text-stone-700 group-hover:text-stone-900">Reservations</span>
                <span class="ml-auto text-stone-400 group-hover:translate-x-1 transition-transform">→</span>
            </a>
        </nav>

        <!-- Footer / Logout -->
        <div class="border-t border-stone-200/80 px-4 py-4 bg-white/50">
            <button id="logout-btn" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-xl text-red-600 font-chakra font-semibold hover:bg-red-50 transition-all duration-300 group">
                <span class="w-9 h-9 rounded-lg bg-red-100 flex items-center justify-center text-lg group-hover:scale-110 transition-transform">🚪</span>
                <span>Logout</span>
                <span class="ml-auto text-red-300 group-hover:translate-x-1 transition-transform">→</span>
            </button>
        </div>
    </div>


    <!-- HERO SECTION WITH DYNAMIC ANIMATED SHAPES & COLORS -->
    <div class="relative w-full overflow-hidden border-b border-stone-200/60 pb-16 pt-8">
        
        <!-- Animated Background Color Orbs & Floating Geometric Shapes (Green Orb shifted closer: left-1/3) -->
        <div class="absolute top-0 left-[35%] -translate-x-1/2 w-[600px] h-[380px] bg-[#82D6A5]/15 blur-[130px] rounded-full pointer-events-none animate-float-slow"></div>
        <div class="absolute top-20 right-1/4 translate-x-1/2 w-[650px] h-[380px] bg-[#80B6E9]/20 blur-[130px] rounded-full pointer-events-none animate-float-slow" style="animation-delay: 3s;"></div>
        <div class="absolute -bottom-10 left-1/2 -translate-x-1/2 w-[700px] h-[320px] bg-[#F69664]/15 blur-[130px] rounded-full pointer-events-none animate-float-slow" style="animation-delay: 6s;"></div>

        <!-- Floating Animated Rings and Spheres in Background -->
        <div class="absolute top-12 left-10 w-24 h-24 border-4 border-[#82D6A5]/30 rounded-full animate-float-slow pointer-events-none"></div>
        <div class="absolute top-1/2 right-12 w-36 h-36 border-2 border-dashed border-[#80B6E9]/40 rounded-full animate-spin-slow pointer-events-none"></div>
        <div class="absolute bottom-6 left-1/3 w-16 h-16 bg-[#F69664]/20 backdrop-blur-sm rounded-3xl rotate-12 animate-float-slow pointer-events-none" style="animation-delay: 2s;"></div>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full relative z-10 flex flex-col items-center">

            <!-- 2. Main Banner (With lighter transparent background colors underneath) -->
            <section class="mt-4 mb-8 w-full max-w-[320px] flex justify-center">
                <div class="relative w-full h-[200px] rounded-3xl overflow-hidden shadow-xl border-2 border-white/90 bg-white group transition-all duration-500 hover:shadow-2xl hover:shadow-[#80B6E9]/30 hover:border-[#80B6E9]/70">
                    <img src="assets/images/main-logo.webp" alt="Main Banner" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-tr from-[#80B6E9]/8 via-transparent to-[#82D6A5]/8 opacity-70 group-hover:opacity-100 transition-opacity duration-500"></div>
                </div>
            </section>

            <!-- 3. Search Box Capsule -->
            <section class="w-full max-w-2xl mb-14 px-2">
                <form action="search.html" method="GET" class="relative flex items-center group">
                    <div class="absolute -inset-1 bg-gradient-to-r from-[#82D6A5] via-[#80B6E9] to-[#F69664] rounded-full blur opacity-30 group-hover:opacity-75 transition duration-500"></div>
                    
                    <input 
                        type="text" 
                        name="q" 
                        placeholder="Search matches, teams, or venues..." 
                        class="relative w-full bg-white/90 backdrop-blur-md border border-stone-300/80 rounded-full py-4 pr-16 pl-7 text-stone-800 placeholder-stone-400 font-chakra font-normal text-sm sm:text-base shadow-md group-hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-[#80B6E9] transition-all duration-300"
                    >
                    <button type="submit" class="absolute right-2 z-10 bg-gradient-to-r from-[#80B6E9] to-[#82D6A5] text-slate-950 p-3 rounded-full transition-all duration-300 shadow-md hover:scale-110 active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.3" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607z" />
                        </svg>
                    </button>
                </form>
            </section>

            <!-- 4. 3 Sport Category Buttons -->
            <section class="grid grid-cols-1 sm:grid-cols-3 gap-6 w-full max-w-4xl px-2">
                
                <!-- Football Card -->
                <a href="search.html?sport=football" class="relative h-28 sm:h-32 rounded-3xl overflow-hidden group shadow-lg hover:shadow-2xl hover:shadow-[#82D6A5]/50 transition-all duration-500 border-2 border-[#82D6A5] animate-float-card">
                    <img src="assets/images/football-icon.webp" alt="Football" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-r from-stone-900/40 via-stone-900/20 to-[#82D6A5]/30 backdrop-blur-[1px] flex items-center justify-center transition-all duration-300 group-hover:bg-[#82D6A5]/40">
                        <span class="font-oswald font-extrabold text-2xl sm:text-3xl tracking-wider text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">
                            FOOTBALL
                        </span>
                    </div>
                </a>

                <!-- Volleyball Card -->
                <a href="search.html?sport=volleyball" class="relative h-28 sm:h-32 rounded-3xl overflow-hidden group shadow-lg hover:shadow-2xl hover:shadow-[#80B6E9]/50 transition-all duration-500 border-2 border-[#80B6E9] animate-float-card" style="animation-delay: 1.2s;">
                    <img src="assets/images/volleyball-icon.webp" alt="Volleyball" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-r from-stone-900/40 via-stone-900/20 to-[#80B6E9]/30 backdrop-blur-[1px] flex items-center justify-center transition-all duration-300 group-hover:bg-[#80B6E9]/40">
                        <span class="font-oswald font-extrabold text-2xl sm:text-3xl tracking-wider text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">
                            VOLLEYBALL
                        </span>
                    </div>
                </a>

                <!-- Basketball Card -->
                <a href="search.html?sport=basketball" class="relative h-28 sm:h-32 rounded-3xl overflow-hidden group shadow-lg hover:shadow-2xl hover:shadow-[#F69664]/50 transition-all duration-500 border-2 border-[#F69664] animate-float-card" style="animation-delay: 2.4s;">
                    <img src="assets/images/basketball-icon.webp" alt="Basketball" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-r from-stone-900/40 via-stone-900/20 to-[#F69664]/30 backdrop-blur-[1px] flex items-center justify-center transition-all duration-300 group-hover:bg-[#F69664]/40">
                        <span class="font-oswald font-extrabold text-2xl sm:text-3xl tracking-wider text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">
                            BASKETBALL
                        </span>
                    </div>
                </a>

            </section>

        </main>
    </div>

    <!-- LOWER SECTION: UPCOMING MATCHES WITH ULTRA-LUXE GLASS CARDS -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full flex-grow flex flex-col items-center pt-12 pb-16 relative">

        <!-- Ambient Background Accents for Match Section -->
        <div class="absolute top-1/2 left-0 w-72 h-72 bg-[#82D6A5]/10 blur-[100px] rounded-full pointer-events-none"></div>
        <div class="absolute bottom-10 right-0 w-72 h-72 bg-[#80B6E9]/10 blur-[100px] rounded-full pointer-events-none"></div>

        <!-- 5. Section Title -->
        <section class="w-full mb-10 relative z-10">
            <div class="flex items-center justify-between border-b-2 border-stone-300/80 pb-4">
                <div class="flex items-center gap-3">
                    <span class="w-3.5 h-8 bg-gradient-to-b from-[#80B6E9] to-[#82D6A5] rounded-full animate-pulse"></span>
                    <h2 class="font-oswald font-bold text-3xl sm:text-4xl text-stone-900 tracking-wider uppercase">
                        UPCOMING MATCHES
                    </h2>
                </div>
            </div>
        </section>

        <!-- 6. GLASSMORPHISM TICKET MATCH CARDS -->
        <section class="w-full relative z-10">
            <div id="upcoming-matches-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                
            </div>
        </section>

    </main>

    <!-- 7. Footer -->
    <footer class="bg-[#FBF9F5] text-stone-600 border-t border-stone-300/60 py-8 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 font-chakra text-xs">
            
            <div class="flex items-center gap-3">
                <img src="assets/images/footer-logo.webp" alt="Footer Logo" class="h-8 w-auto">
                <span class="font-medium text-stone-600">Match Ticket Reservation System</span>
            </div>

            <div class="flex gap-6 text-stone-500 font-medium">
                <a href="index.html" class="hover:text-stone-900 transition-colors">Home</a>
            </div>

            <div class="text-stone-400">
                &copy; 2026 All rights reserved.
            </div>

        </div>
    </footer>

    <!-- JS Files -->
    <script type="module" src="js/services/api.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/pages/home.js"></script>
</body>
</html>
