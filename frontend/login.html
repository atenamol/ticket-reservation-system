<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Sports Ticket</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500&family=Lexend:wght@700&family=Oswald:wght@500&display=swap" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <style>
        body {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 500;
        }
        .title-font {
            font-family: 'Oswald', sans-serif;
            font-weight: 500;
        }
        .number-font {
            font-family: 'Lexend', sans-serif;
            font-weight: 700;
        }

        .card-rounded {
            border-radius: 16px;
        }
        .btn-pill {
            border-radius: 9999px;
            transition: all 0.3s ease;
        }

        /* ===== امواج پس‌زمینه ===== */
        .wave {
            position: fixed;
            border-radius: 40% 60% 30% 70% / 50% 40% 60% 50%;
            will-change: transform;
            z-index: -10;
            opacity: 0.6;
        }

        @keyframes waveFloat1 {
            0% { transform: translateX(0) rotate(0deg) scale(1); }
            50% { transform: translateX(80px) rotate(8deg) scale(1.05); }
            100% { transform: translateX(0) rotate(0deg) scale(1); }
        }
        @keyframes waveFloat2 {
            0% { transform: translateX(0) rotate(0deg) scale(1); }
            50% { transform: translateX(-100px) rotate(-6deg) scale(1.1); }
            100% { transform: translateX(0) rotate(0deg) scale(1); }
        }
        @keyframes waveFloat3 {
            0% { transform: translateX(0) rotate(0deg) scale(1); }
            50% { transform: translateX(60px) rotate(12deg) scale(0.9); }
            100% { transform: translateX(0) rotate(0deg) scale(1); }
        }
        @keyframes waveFloat4 {
            0% { transform: translateX(0) rotate(0deg) scale(1); }
            50% { transform: translateX(-70px) rotate(-10deg) scale(1.15); }
            100% { transform: translateX(0) rotate(0deg) scale(1); }
        }

        .wave-1 {
            animation: waveFloat1 12s ease-in-out infinite alternate;
            width: 600px;
            height: 500px;
            top: -150px;
            left: -200px;
            background: #D6F5E3;
            opacity: 0.7;
        }
        .wave-2 {
            animation: waveFloat2 14s ease-in-out infinite alternate;
            width: 550px;
            height: 450px;
            top: -100px;
            right: -180px;
            left: auto;
            bottom: auto;
            background: #D9EAFB;
            opacity: 0.6;
        }
        .wave-3 {
            animation: waveFloat3 10s ease-in-out infinite alternate;
            width: 500px;
            height: 450px;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #FDE2D3;
            opacity: 0.5;
        }
        .wave-4 {
            animation: waveFloat4 8s ease-in-out infinite alternate;
            width: 300px;
            height: 250px;
            bottom: 10%;
            left: 5%;
            background: #52C485;
            opacity: 0.2;
            filter: blur(30px);
        }
        .wave-5 {
            animation: waveFloat1 9s ease-in-out infinite alternate;
            width: 280px;
            height: 220px;
            bottom: 15%;
            right: 8%;
            top: auto;
            background: #569CE3;
            opacity: 0.15;
            filter: blur(30px);
        }

        /* ===== حباب‌های مایع ===== */
        .bubble {
            position: fixed;
            border-radius: 50%;
            z-index: -8;
            will-change: transform;
            pointer-events: none;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.2) 60%, rgba(255,255,255,0.05) 100%);
            box-shadow: 
                inset -8px -8px 20px rgba(0,0,0,0.05),
                inset 8px 8px 20px rgba(255,255,255,0.4),
                0 4px 20px rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(2px);
            transition: all 0.1s ease;
        }

        @keyframes bubbleFloat1 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.6; }
            25% { transform: translate(150px, -80px) scale(1.1); opacity: 0.8; }
            50% { transform: translate(300px, 50px) scale(0.9); opacity: 0.5; }
            75% { transform: translate(100px, 120px) scale(1.05); opacity: 0.7; }
            100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
        }
        @keyframes bubbleFloat2 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            33% { transform: translate(-200px, 100px) scale(0.8); opacity: 0.7; }
            66% { transform: translate(150px, -120px) scale(1.2); opacity: 0.4; }
            100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
        }
        @keyframes bubbleFloat3 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            50% { transform: translate(-100px, -150px) scale(1.3); opacity: 0.8; }
            100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
        }
        @keyframes bubbleFloat4 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.6; }
            25% { transform: translate(180px, 100px) scale(0.7); opacity: 0.3; }
            75% { transform: translate(-120px, -80px) scale(1.15); opacity: 0.7; }
            100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
        }
        @keyframes bubbleFloat5 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            40% { transform: translate(-250px, -60px) scale(1.2); opacity: 0.8; }
            80% { transform: translate(200px, 80px) scale(0.8); opacity: 0.3; }
            100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
        }
        @keyframes bubbleFloat6 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            60% { transform: translate(120px, -180px) scale(0.9); opacity: 0.7; }
            100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
        }

        .bubble-1 {
            animation: bubbleFloat1 14s ease-in-out infinite;
            width: 80px;
            height: 80px;
            top: 10%;
            left: 8%;
            background: radial-gradient(circle at 30% 30%, rgba(214, 245, 227, 0.6), rgba(214, 245, 227, 0.1) 70%);
            border-color: rgba(214, 245, 227, 0.4);
        }
        .bubble-2 {
            animation: bubbleFloat2 16s ease-in-out infinite 1s;
            width: 100px;
            height: 100px;
            top: 5%;
            right: 12%;
            bottom: auto;
            background: radial-gradient(circle at 35% 25%, rgba(217, 234, 251, 0.5), rgba(217, 234, 251, 0.1) 70%);
            border-color: rgba(217, 234, 251, 0.3);
        }
        .bubble-3 {
            animation: bubbleFloat3 12s ease-in-out infinite 2s;
            width: 60px;
            height: 60px;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            top: auto;
            background: radial-gradient(circle at 25% 30%, rgba(253, 226, 211, 0.6), rgba(253, 226, 211, 0.1) 70%);
            border-color: rgba(253, 226, 211, 0.4);
        }
        .bubble-4 {
            animation: bubbleFloat4 18s ease-in-out infinite 0.5s;
            width: 45px;
            height: 45px;
            top: 30%;
            right: 25%;
            background: radial-gradient(circle at 40% 30%, rgba(82, 196, 133, 0.25), rgba(82, 196, 133, 0.05) 70%);
            border-color: rgba(82, 196, 133, 0.15);
        }
        .bubble-5 {
            animation: bubbleFloat5 15s ease-in-out infinite 1.5s;
            width: 90px;
            height: 90px;
            bottom: 10%;
            left: 20%;
            background: radial-gradient(circle at 30% 35%, rgba(86, 156, 227, 0.2), rgba(86, 156, 227, 0.05) 70%);
            border-color: rgba(86, 156, 227, 0.15);
        }
        .bubble-6 {
            animation: bubbleFloat6 13s ease-in-out infinite 3s;
            width: 50px;
            height: 50px;
            top: 70%;
            right: 35%;
            background: radial-gradient(circle at 35% 25%, rgba(244, 120, 59, 0.2), rgba(244, 120, 59, 0.05) 70%);
            border-color: rgba(244, 120, 59, 0.15);
        }

        /* ===== حباب‌های جدید نارنجی (افزایش تعداد) ===== */
        .bubble-7 {
            animation: bubbleFloat2 14s ease-in-out infinite 4s;
            width: 70px;
            height: 70px;
            top: 15%;
            right: 5%;
            background: radial-gradient(circle at 30% 30%, rgba(244, 120, 59, 0.25), rgba(244, 120, 59, 0.05) 70%);
            border-color: rgba(244, 120, 59, 0.2);
        }
        .bubble-8 {
            animation: bubbleFloat4 16s ease-in-out infinite 2.5s;
            width: 55px;
            height: 55px;
            bottom: 30%;
            left: 10%;
            background: radial-gradient(circle at 35% 25%, rgba(244, 120, 59, 0.2), rgba(244, 120, 59, 0.05) 70%);
            border-color: rgba(244, 120, 59, 0.15);
        }
        .bubble-9 {
            animation: bubbleFloat6 12s ease-in-out infinite 5s;
            width: 90px;
            height: 90px;
            top: 60%;
            right: 15%;
            background: radial-gradient(circle at 40% 30%, rgba(244, 120, 59, 0.3), rgba(244, 120, 59, 0.05) 70%);
            border-color: rgba(244, 120, 59, 0.25);
        }

        /* ===== کارت شیشه‌ای ===== */
        .glass-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.3) 0%,
                rgba(255, 255, 255, 0) 50%,
                rgba(255, 255, 255, 0.05) 100%
            );
            transform: rotate(30deg);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== انیمیشن‌های دیگر ===== */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.7s ease-out forwards;
        }

        /* ===== دکمه‌های انتخاب ورود ===== */
        .login-option {
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            border-radius: 16px;
            padding: 20px;
        }
        .login-option:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .login-option.password {
            border-color: rgba(86, 156, 227, 0.3);
        }
        .login-option.password:hover {
            border-color: #569CE3;
            background: rgba(86, 156, 227, 0.08);
            box-shadow: 0 8px 24px rgba(86, 156, 227, 0.15);
        }

        .login-option.otp {
            border-color: rgba(82, 196, 133, 0.3);
        }
        .login-option.otp:hover {
            border-color: #52C485;
            background: rgba(82, 196, 133, 0.08);
            box-shadow: 0 8px 24px rgba(82, 196, 133, 0.15);
        }

        /* ===== لینک‌ها ===== */
        .login-link {
            position: relative;
            font-weight: 700;
            color: #569CE3;
            transition: color 0.3s ease;
        }
        .login-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #52C485;
            transition: width 0.3s ease;
        }
        .login-link:hover {
            color: #52C485;
        }
        .login-link:hover::after {
            width: 100%;
        }

        .link-hover-slide {
            transition: all 0.3s ease;
        }
        .link-hover-slide:hover {
            transform: translateX(6px);
            color: #569CE3;
        }
    </style>
</head>

<body class="min-h-screen bg-[#FBF9F5] flex justify-center items-center p-6">

    <!-- ===== امواج پس‌زمینه ===== -->
    <div class="wave wave-1"></div>
    <div class="wave wave-2"></div>
    <div class="wave wave-3"></div>
    <div class="wave wave-4"></div>
    <div class="wave wave-5"></div>

    <!-- ===== حباب‌های مایع ===== -->
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>
    <div class="bubble bubble-3"></div>
    <div class="bubble bubble-4"></div>
    <div class="bubble bubble-5"></div>
    <div class="bubble bubble-6"></div>
    
    <!-- سه حباب نارنجی جدید برای بیشتر شدن رنگ نارنجی پس‌زمینه -->
    <div class="bubble bubble-7"></div>
    <div class="bubble bubble-8"></div>
    <div class="bubble bubble-9"></div>

    <main class="w-full max-w-md px-4 py-10 z-10 animate-fade-up">

        <!-- لوگو و اسم سایت  -->
        <div class="text-center mb-8">
            <!-- لوگوی سایت (مستطیلی با گوشه‌های گرد - تصویر کامل دیده میشه) -->
            <img src="assets/images/main-logo.webp"
                alt="Site Logo"
                class="w-32 h-auto mx-auto mb-4 rounded-xl shadow-lg animate-float object-contain" />

            <!-- اسم سایت با باکس محو (بلور) دور و اطراف -->
            <div class="inline-block px-6 py-3 rounded-2xl bg-white/10 backdrop-blur-md shadow-lg border border-white/20">
                <img src="assets/images/header-logo.webp"
                    alt="Sports Ticket"
                    class="max-w-[200px] h-auto" />
            </div>

            <p class="mt-4 text-gray-500 text-sm">Create your free account</p>
        </div>

        <!-- کارت شیشه‌ای -->
        <section class="glass-card p-8 shadow-2xl border border-white/40">

            <h2 class="text-center text-xl mb-6 text-[#2D2D2D] font-semibold">
                How do you want to login?
            </h2>

            <!-- گزینه‌ی ورود با رمز عبور -->
            <a href="login-password.html" class="login-option password block mb-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-[#569CE3] flex items-center justify-center text-white flex-shrink-0">
                        <i class="bi bi-lock-fill text-xl"></i>
                    </div>
                    <div>
                        <h3 class="text-[#569CE3] font-semibold">Password Login</h3>
                        <p class="text-sm text-gray-600">Login using your password</p>
                    </div>
                </div>
            </a>

            <!-- گزینه‌ی ورود با OTP -->
            <a href="login-otp.html" class="login-option otp block">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-[#52C485] flex items-center justify-center text-white flex-shrink-0">
                        <i class="bi bi-phone-fill text-xl"></i>
                    </div>
                    <div>
                        <h3 class="text-[#52C485] font-semibold">OTP Login</h3>
                        <p class="text-sm text-gray-600">Login using verification code</p>
                    </div>
                </div>
            </a>

            <!-- لینک‌های پایین -->
            <div class="text-center mt-8 relative z-10">
                <p class="text-gray-600">
                    Don't have an account?
                    <a href="signup.html" class="login-link">
                        Sign Up
                    </a>
                </p>
                <a href="index.html" class="inline-block mt-4 text-sm text-gray-400 link-hover-slide">
                    <i class="bi bi-arrow-left me-1"></i> Back to Home
                </a>
            </div>

        </section>
    </main>

</body>
</html>
