<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Issue - TicketHub</title>
    
    <!-- CDN Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Oswald & Chakra Petch -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: '#FBF9F5',
                        blueMain: '#80B6E9',
                        blueLight: '#D9EAFB',
                        greenMain: '#82D6A5',
                        greenLight: '#D6F5E3',
                        orangeMain: '#F69664',
                        orangeLight: '#FDE8D3',
                    },
                    fontFamily: {
                        chakra: ['"Chakra Petch"', 'sans-serif'],
                        oswald: ['"Oswald"', 'sans-serif'],
                    },
                    boxShadow: {
                        'ticket': '0 20px 40px -15px rgba(0, 0, 0, 0.07), 0 0 0 1px rgba(0,0,0,0.04)',
                        'layer': '-8px 8px 0px 0px rgba(128, 182, 233, 0.2)',
                    }
                }
            }
        }
    </script>

    <style>
        /* پس‌زمینه بسیار نرم و ملایم */
        .bg-[#FBF9F5] {
            background-color: #FBF9F5;
            background-image: 
                linear-gradient(rgba(128, 182, 233, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(128, 182, 233, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .text-outline {
            -webkit-text-stroke: 1.5px rgba(128, 182, 233, 0.18);
            color: transparent;
        }

        /* انیمیشن چرخش نوری فوق‌العاده محو */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.20; transform: scale(1); }
            50% { opacity: 0.30; transform: scale(1.05); }
        }
        .animate-glow {
            animation: pulseGlow 10s ease-in-out infinite;
        }
        .animated-gradient-btn {
        background-size: 200% 200%;
    }
    @keyframes gradientBG {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
    }
    .animate-gradient-shift {
        animation: gradientBG 4s ease infinite;
    }
    </style>
</head>
<body class="bg-[#FBF9F5] text-stone-800 antialiased font-chakra min-h-screen flex flex-col justify-between selection:bg-[#80B6E9] selection:text-white relative overflow-x-hidden">

    <!-- Dynamic Ultra-Subtle Background Elements -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden select-none">
        
        <!-- Subtle Ambient Color Glow Orbs -->
        <div class="absolute -top-32 -left-32 w-[500px] h-[500px] bg-[#80B6E9] rounded-full blur-[140px] opacity-12 animate-glow"></div>
        <div class="absolute -bottom-32 -right-32 w-[500px] h-[500px] bg-[#F69664] rounded-full blur-[140px] opacity-10 animate-glow" style="animation-delay: 5s;"></div>

        <!-- Decorative Ticket Watermark Side Text -->
        <!-- Decorative Ticket Watermark Side Text -->
        <div class="absolute left-6 top-1/2 -translate-y-1/2 hidden xl:block">
            <div class="font-oswald text-7xl font-bold text-outline -rotate-90 tracking-widest opacity-75">
                TICKET
            </div>
        </div>
        <div class="absolute right-6 top-1/2 -translate-y-1/2 hidden xl:block">
            <div class="font-oswald text-7xl font-bold text-outline rotate-90 tracking-widest opacity-75">
                SUPPORT
            </div>
        </div>

    </div>

    <!-- Header -->
    <header class="bg-[#FBF9F5]/50 backdrop-blur-xl border-b border-stone-200/50 shadow-sm sticky top-0 z-50 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 h-20 relative flex items-center justify-between">

            <div class="w-24 sm:w-36">
                <a href="index.html"
                class="inline-flex items-center gap-2 px-4 py-2 rounded-full
                        bg-white/80 border border-stone-200/60
                        text-stone-600 font-bold text-xs sm:text-sm
                        shadow-sm
                        hover:bg-[#80B6E9] hover:border-[#80B6E9] hover:text-white
                        transition-all duration-200">

                    <span>&larr;</span>
                    <span>Back</span>

                </a>
            </div>

            <!-- Center Logo -->
            <a href="index.html" class="absolute left-1/2 -translate-x-1/2 flex items-center group max-w-[120px] sm:max-w-none">
                <img src="assets/images/header-logo.webp" alt="TicketHub Logo" class="h-18 sm:h-12 w-auto object-contain transition-transform duration-300 group-hover:scale-105">
            </a>

        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 w-full flex-grow py-12 relative z-10">

        <!-- Outer Decorative Layer for 3D Effect -->
        <div class="relative">
            <!-- Background Accent Layer -->
            <div class="absolute inset-0 bg-[#D9EAFB] rounded-3xl transform translate-x-2 translate-y-2.5 -rotate-1 border border-[#80B6E9]/40"></div>

            <!-- Main Card -->
            <div class="bg-white rounded-3xl border border-stone-200 shadow-ticket p-6 sm:p-10 relative overflow-hidden">
                
                <!-- Ticket Notch Visual Cutouts (Top-Left & Top-Right) -->
                <div class="absolute top-12 -left-3 w-6 h-6 bg-[#FBF9F5] rounded-full border-r border-stone-200 hidden sm:block"></div>
                <div class="absolute top-12 -right-3 w-6 h-6 bg-[#FBF9F5] rounded-full border-l border-stone-200 hidden sm:block"></div>

                <!-- Top Header & Tabs -->
                <div class="border-b border-dashed border-stone-300 pb-6 mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#D9EAFB] text-[#4A90E2] text-xs font-bold mb-2">
                            <span class="w-2 h-2 rounded-full bg-[#80B6E9]"></span> Help Desk
                        </div>
                        <h1 class="font-oswald text-2xl sm:text-3xl font-bold text-stone-900 uppercase tracking-wide">
                            Report & Support
                        </h1>
                    </div>

                    <!-- Clean Pill Tabs -->
                    <div class="flex items-center p-1 bg-stone-100 rounded-2xl self-start sm:self-auto border border-stone-200">
                        <button type="button" id="tab-btn-new" class="px-5 py-2 rounded-xl text-xs font-bold transition-all bg-white text-stone-900 shadow-sm">
                            Submit Issue
                        </button>
                        <button type="button" id="tab-btn-history" class="px-5 py-2 rounded-xl text-xs font-bold transition-all text-stone-500 hover:text-stone-900">
                            History <span class="bg-[#F69664] text-white text-[10px] px-2 py-0.5 rounded-full ml-1 font-bold">0</span>
                        </button>
                    </div>
                </div>

                <!-- SECTION 1: New Report Form -->
                <div id="tab-content-new">
                    <form id="report-form" class="space-y-6">
                        <div
                            id="report-message"
                            class="hidden px-4 py-3 rounded-2xl text-sm font-bold"
                        ></div>
                        
                        <!-- Ticket ID -->
                        <div>
                            <label for="ticket-id" class="block text-xs font-bold text-stone-600 uppercase tracking-wider mb-2">
                                Associated Ticket ID <span class="text-[#F69664]">*</span>
                            </label>

                            <input
                                type="number"
                                id="ticket-id"
                                name="ticket_id"
                                min="1"
                                step="1"
                                required
                                placeholder="Enter your ticket ID"
                                class="w-full bg-stone-50 border border-stone-200 rounded-2xl px-4 py-3 text-stone-800 font-chakra font-bold text-sm focus:outline-none focus:border-[#80B6E9] focus:ring-2 focus:ring-[#80B6E9]/30 transition-all"
                            >
                        </div>

                        <!-- Issue Subject / Category (Text Input) -->
                        <div>
                            <label for="issue-type" class="block text-xs font-bold text-stone-600 uppercase tracking-wider mb-2">
                                Subject / Issue Category <span class="text-[#F69664]">*</span>
                            </label>
                            <input type="text" id="issue-type" name="subject" required 
                                placeholder="e.g. Discrepancy in ticket price, Gate access issue..." 
                                class="w-full bg-stone-50 border border-stone-200 rounded-2xl px-4 py-3 text-stone-800 font-medium text-sm focus:outline-none focus:border-[#80B6E9] focus:ring-2 focus:ring-[#80B6E9]/30 transition-all">
                        </div>

                        <!-- Description -->
                        <div>
                            <label for="description" class="block text-xs font-bold text-stone-600 uppercase tracking-wider mb-2">
                                Description <span class="text-[#F69664]">*</span>
                            </label>
                            <textarea
                                id="description"
                                name="description"
                                rows="4"
                                minlength="10"
                                maxlength="2000"
                                required
                                placeholder="Provide details about the problem..."
                                class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-4 text-stone-800 font-medium text-sm focus:outline-none focus:border-[#80B6E9] focus:ring-2 focus:ring-[#80B6E9]/30 transition-all resize-none"
                            ></textarea>
                        </div>

                        <!-- Submit Button -->
                        <div class="pt-2 flex justify-end">
                            <button type="submit" class="bg-[#F69664] hover:bg-[#e8814d] text-white font-chakra font-bold text-xs sm:text-sm px-8 py-3.5 rounded-2xl transition-all shadow-md active:scale-95 uppercase tracking-wider flex items-center gap-2">
                                Send Report
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                            </button>
                        </div>

                    </form>
                </div>

                <!-- SECTION 2: History List -->
                <div id="tab-content-history" class="hidden space-y-4">
                    <div id="reports-list"></div>
                </div>

            </div>
        </div>

    </main>

    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/pages/report.js"></script>

</body>
</html>
