<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search & Filter Matches - TicketHub</title>
    
    <!-- CDN Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Oswald & Chakra Petch -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <!-- Tailwind Custom Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: '#FBF9F5',
                        football: {
                            light: '#D6F5E3',
                            bold: '#82D6A5',
                        },
                        volleyball: {
                            light: '#D9EAFB',
                            bold: '#80B6E9',
                        },
                        basketball: {
                            light: '#FDE2D3',
                            bold: '#F69664',
                        }
                    },
                    fontFamily: {
                        chakra: ['"Chakra Petch"', 'sans-serif'],
                        oswald: ['"Oswald"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
    .animated-gradient-btn {
        background-size: 200% 200%;
    }
    @keyframes gradientBG {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
    }
    .animate-gradient-shift {
        animation: gradientBG 4s ease infinite;
    }
</style>

</head>
<body class="bg-[#FBF9F5] text-stone-800 antialiased font-chakra min-h-screen flex flex-col justify-between">

    <!-- 1. Header -->
    <header class="bg-[#FBF9F5]/50 backdrop-blur-xl border-b border-stone-200/50 shadow-sm sticky top-0 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 h-20 relative flex items-center justify-between">

            <div class="w-24 sm:w-36">
                <a href="index.html" class="text-stone-600 hover:text-stone-900 font-medium text-xs sm:text-sm flex items-center gap-1.5 transition group">
                    <span class="group-hover:-translate-x-1 transition-transform">&larr;</span> 
                    <span>Home</span>
                </a>
            </div>

            <!-- Center Logo -->
            <a href="index.html" class="absolute left-1/2 -translate-x-1/2 flex items-center group max-w-[120px] sm:max-w-none">
                <img src="assets/images/header-logo.webp" alt="TicketHub Logo" class="h-18 sm:h-12 w-auto object-contain transition-transform duration-300 group-hover:scale-105">
            </a>

                <!-- Right Animated Login/Signup Button -->
            <div class="relative group w-auto flex justify-end">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-[#82D6A5] via-[#80B6E9] to-[#F69664] rounded-full blur opacity-75 group-hover:opacity-100 transition duration-500 animated-gradient-btn animate-gradient-shift"></div>
                <a href="login.html" class="relative bg-gradient-to-r from-[#82D6A5] via-[#80B6E9] to-[#F69664] animated-gradient-btn animate-gradient-shift text-slate-950 font-chakra font-bold text-[10px] sm:text-sm px-3.5 sm:px-6 py-2 sm:py-2.5 rounded-full transition-all duration-300 shadow-md flex items-center hover:scale-105 whitespace-nowrap">
                    <span>Login / Signup</span>
                </a>
            </div>

        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full flex-grow py-8">

        <!-- Search Bar Capsule (Identical to Homepage) -->
        <section class="w-full max-w-2xl mx-auto mb-10 px-2">
            <form id="top-search-form" action="search.html" method="GET" class="relative flex items-center">
                <input 
                    type="text" 
                    id="search-input-field"
                    name="q" 
                    placeholder="Search matches, teams, or venues..." 
                    class="w-full bg-white border border-stone-300 rounded-full py-3.5 pr-14 pl-6 text-stone-800 placeholder-stone-400 font-chakra font-light text-sm sm:text-base shadow-sm focus:outline-none focus:ring-2 focus:ring-[#80B6E9] transition"
                >
                <button type="submit" class="absolute right-3 bg-[#D9EAFB] hover:bg-[#80B6E9] text-slate-800 p-2.5 rounded-full transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607z" />
                    </svg>
                </button>
            </form>
        </section>

        <!-- Page Header Section -->
        <section class="w-full mb-8 border-b border-stone-300/70 pb-4">
            <h1 class="font-oswald font-medium text-3xl sm:text-4xl text-stone-900 tracking-wide uppercase">
                SEARCH MATCHES
            </h1>
            <p id="search-query-display" class="text-stone-500 text-sm mt-1">
               Find your desired match by filtering details.
            </p>
        </section>

        <!-- Main Layout: Sidebar Filters + Results Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">

            <!-- ElasticSearch Filters Sidebar -->
            <aside class="lg:col-span-1 bg-white p-6 rounded-3xl border border-stone-200/90 shadow-sm h-fit">
                <div class="flex justify-between items-center mb-6 border-b border-stone-100 pb-3">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-[#80B6E9]"></span>
                        <h2 class="font-oswald font-medium text-xl text-stone-900 uppercase tracking-wider">Filters</h2>
                    </div>
                    <button type="reset" form="elasticsearch-filter-form" id="btn-reset-filters" class="text-xs font-semibold text-stone-400 hover:text-rose-500 transition">
                        Reset
                    </button>
                </div>

                <form id="elasticsearch-filter-form" class="space-y-6 text-sm">

                    <!-- 1. Sport Type (Main Vibrant Colors) -->
                    <div>
                        <label class="block font-bold text-stone-800 mb-2 text-xs uppercase tracking-wider">Sport Type</label>
                        <div class="grid grid-cols-3 gap-1.5 text-center font-bold text-xs">
                            <label class="cursor-pointer">
                                <input type="radio" name="sport" value="football" class="peer hidden">
                                <span class="block py-2 rounded-xl bg-[#D6F5E3] text-emerald-900 border border-transparent peer-checked:border-emerald-600 peer-checked:ring-2 peer-checked:ring-emerald-400 transition">
                                    ⚽ Football
                                </span>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="sport" value="volleyball" class="peer hidden">
                                <span class="block py-2 rounded-xl bg-[#D9EAFB] text-sky-900 border border-transparent peer-checked:border-sky-600 peer-checked:ring-2 peer-checked:ring-sky-400 transition">
                                    🏐 Volley
                                </span>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="sport" value="basketball" class="peer hidden">
                                <span class="block py-2 rounded-xl bg-[#FDE2D3] text-orange-900 border border-transparent peer-checked:border-orange-500 peer-checked:ring-2 peer-checked:ring-orange-400 transition">
                                    🏀 Basket
                                </span>
                            </label>
                        </div>
                    </div>

                    <!-- 2. Category (Sighter Pastel Tones Always Visible) -->
                    <div>
                        <label class="block font-bold text-stone-800 mb-2 text-xs uppercase tracking-wider">Ticket Category</label>
                        <div class="grid grid-cols-3 gap-1.5 text-center font-bold text-xs">
                            <label class="cursor-pointer">
                                <input type="radio" name="category" value="VIP" class="peer hidden">
                                <span class="block py-2 rounded-xl bg-[#EAF9F0] text-emerald-900 border border-transparent peer-checked:border-emerald-500 peer-checked:ring-2 peer-checked:ring-emerald-300 transition">
                                    VIP
                                </span>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="category" value="Normal" class="peer hidden">
                                <span class="block py-2 rounded-xl bg-[#EEF5FC] text-sky-900 border border-transparent peer-checked:border-sky-500 peer-checked:ring-2 peer-checked:ring-sky-300 transition">
                                    Normal
                                </span>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="category" value="Special" class="peer hidden">
                                <span class="block py-2 rounded-xl bg-[#FFF2EC] text-orange-900 border border-transparent peer-checked:border-orange-400 peer-checked:ring-2 peer-checked:ring-orange-300 transition">
                                    Special
                                </span>
                            </label>
                        </div>
                    </div>

                    <!-- 3. City -->
                    <div>
                        <label for="filter-city" class="block font-bold text-stone-800 mb-1.5 text-xs uppercase tracking-wider">City</label>
                        <select id="filter-city" name="city" class="w-full bg-[#FBF9F5] border border-stone-300 rounded-xl px-3.5 py-2.5 text-stone-800 font-medium focus:outline-none focus:ring-2 focus:ring-[#80B6E9]">
                            <option value="">All Cities</option>
                            <option value="tehran">Tehran</option>
                            <option value="isfahan">Isfahan</option>
                            <option value="mashhad">Mashhad</option>
                            <option value="tabriz">Tabriz</option>
                        </select>
                    </div>

                    <!-- 4. Venue -->
                    <div>
                        <label for="filter-venue" class="block font-bold text-stone-800 mb-1.5 text-xs uppercase tracking-wider">Venue</label>
                        <select id="filter-venue" name="venue" class="w-full bg-[#FBF9F5] border border-stone-300 rounded-xl px-3.5 py-2.5 text-stone-800 font-medium focus:outline-none focus:ring-2 focus:ring-[#80B6E9]">
                            <option value="">All Venues</option>
                            <option value="azadi">Azadi Stadium</option>
                            <option value="freedom_hall">Freedom Hall</option>
                            <option value="arena_hall">Arena Hall</option>
                        </select>
                    </div>

                    <!-- 5. Team -->
                    <div>
                        <label for="filter-team" class="block font-bold text-stone-800 mb-1.5 text-xs uppercase tracking-wider">Team</label>
                        <select id="filter-team" name="team" class="w-full bg-[#FBF9F5] border border-stone-300 rounded-xl px-3.5 py-2.5 text-stone-800 font-medium focus:outline-none focus:ring-2 focus:ring-[#80B6E9]">
                            <option value="">All Teams</option>
                            <option value="team_a">Team A</option>
                            <option value="team_b">Team B</option>
                            <option value="team_c">Team C</option>
                            <option value="team_d">Team D</option>
                        </select>
                    </div>

                    <!-- 6. Date Range -->
                    <div class="bg-[#FBF9F5] p-3 rounded-2xl border border-stone-200">
                        <label class="block font-bold text-stone-800 mb-2 text-xs uppercase tracking-wider">Date Range</label>
                        <div class="space-y-2">
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-bold text-stone-400 uppercase w-8">From</span>
                                <input type="date" id="filter-date-from" name="date_from" class="w-full bg-white border border-stone-300 rounded-lg px-2.5 py-1.5 text-xs text-stone-800 focus:outline-none focus:ring-2 focus:ring-[#80B6E9]">
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-bold text-stone-400 uppercase w-8">To</span>
                                <input type="date" id="filter-date-to" name="date_to" class="w-full bg-white border border-stone-300 rounded-lg px-2.5 py-1.5 text-xs text-stone-800 focus:outline-none focus:ring-2 focus:ring-[#80B6E9]">
                            </div>
                        </div>
                    </div>

                    <!-- 7. Price Range -->
                    <div class="bg-[#FBF9F5] p-3 rounded-2xl border border-stone-200">
                        <label class="block font-bold text-stone-800 mb-2 text-xs uppercase tracking-wider">Price Range ($)</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" id="filter-min-price" name="min_price" placeholder="Min $" min="0" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-stone-800 font-medium text-xs placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-[#80B6E9]">
                            <input type="number" id="filter-max-price" name="max_price" placeholder="Max $" min="0" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-stone-800 font-medium text-xs placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-[#80B6E9]">
                        </div>
                    </div>

                    <!-- Apply Filters Button -->
                    <button type="submit" class="w-full bg-[#80B6E9] hover:bg-[#D9EAFB] text-slate-900 font-chakra font-medium py-3 px-4 rounded-2xl transition duration-200 shadow-sm border border-[#80B6E9]/50 uppercase text-xs tracking-wider">
                        Apply Filters
                    </button>

                </form>
            </aside>

            <!-- Results Section -->
            <section class="lg:col-span-3">
                <div id="search-results-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                    
                    <!-- Loading / Placeholder -->
                    <div class="col-span-full text-center py-20 bg-white/60 rounded-3xl border border-dashed border-stone-300 text-stone-400 font-medium">
                        Searching matches...
                    </div>

                </div>
            </section>

        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-[#FBF9F5] text-stone-600 border-t border-stone-300/60 py-8 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 font-chakra text-xs">
            
            <div class="flex items-center gap-3">
                <img src="assets/images/footer-logo.webp" alt="Footer Logo" class="h-8 w-auto">
                <span>Match Ticket Reservation System</span>
            </div>

            <div class="flex gap-6 text-stone-500">
                <a href="index.html" class="hover:text-stone-900 transition">Home</a>
            </div>

            <div class="text-stone-400">
                &copy; 2026 All rights reserved.
            </div>

        </div>
    </footer>

    <!-- JS Files -->
    <script src="js/services/api.js"></script>
    <script src="js/pages/search.js"></script>
</body>
</html>
